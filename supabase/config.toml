# Local development only; never linked to a remote project by these scripts.
project_id = "qr-ordering-p1c02-local"

[api]
enabled = true
port = 15421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 15422
shadow_port = 15420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 15423

[local_smtp]
enabled = false
port = 15424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12

[auth.email]
# CLI uses this switch to enable the email provider; global signup stays off.
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
